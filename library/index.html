<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Avete Morituri Library</title>
<style>
  html, body { margin: 0; height: 100%; background: #0F0C09; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #0F0C09; }
</style>
</head>
<body>
<!-- The private team library (a Google Apps Script web app) framed on our own domain: one clean link, and Safari's
     multi-account Google error cannot happen inside a frame. Access is checked by the app itself (email + code). -->
<iframe id="lib" title="Avete Morituri Library" allow="clipboard-write; fullscreen"></iframe>
<script>
  var base = 'https://script.google.com/macros/s/AKfycbxXucHQ_WdbSEHmUB6_qQi_p3ieJHK8DWwqKqRhV4hT1NwAE-ChRtQs6WkV8Oexnqc/exec';
  var q = new URLSearchParams(location.search), page = q.get('page');
  document.getElementById('lib').src = base + (page ? '?page=' + encodeURIComponent(page) : '');
</script>
</body>
</html>
