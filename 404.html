<!DOCTYPE html>
<html lang="en">
<head>
<!-- ==========================================================================
  404 — GitHub Pages serves this file for ANY missing path, at any depth, so
  everything is inlined (no relative stylesheet) and the home link is
  root-absolute.
  TODO(owner): if hosting as a PROJECT page (username.github.io/repo-name/)

  "/repo-name/".
=========================================================================== -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Martian Bull</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --ink: #0f0d0a; --text: #e9e2d2; --muted: #b3a88f;
      --gold: #c9a227; --gold-hi: #e6c65a; --red: #8c1c13; --red-hi: #d6483a;
      --display: "Trajan Pro", "Optima", Candara, "Palatino Linotype", Palatino,
                 "Book Antiqua", Baskerville, "Times New Roman", serif;
      --body: "Palatino Linotype", Palatino, "Book Antiqua", "Iowan Old Style",
              Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--body); color: var(--text);
      background-color: var(--ink);
      background-image: radial-gradient(900px 500px at 50% -10%, rgba(201,162,39,.08), transparent 60%);
      border-top: 3px solid var(--gold);
      text-align: center; padding: 2rem 1.25rem;
    }
    .plinth { max-width: 34rem; }
    .kicker {
      font-family: var(--display); font-size: .78rem; letter-spacing: .3em;
      text-transform: uppercase; color: var(--red-hi); margin: 0 0 1rem;
    }
    h1 {
      font-family: var(--display); font-weight: 400; color: var(--gold);
      font-size: clamp(3.4rem, 18vw, 6.5rem); letter-spacing: .14em;
      line-height: 1; margin: 0;
      text-shadow: 0 1px 0 rgba(0,0,0,.8);
      border-top: 1px solid rgba(201,162,39,.34);
      border-bottom: 1px solid rgba(201,162,39,.34);
      padding: .35em .1em;
    }
    .sub {
      font-family: var(--display); letter-spacing: .18em; text-transform: uppercase;
      font-size: .9rem; color: var(--muted); margin: 1.2rem 0 0;
    }
    p.body { color: var(--muted); margin: 1.2rem 0 2rem; }
    .laurel { width: min(220px, 65vw); color: var(--gold); opacity: .9; margin: 1.4rem auto 0; display: block; }
    a.btn {
      display: inline-block; font-family: var(--display); font-size: .85rem;
      letter-spacing: .2em; text-transform: uppercase; text-decoration: none;
      padding: .8rem 1.6rem; border: 1px solid var(--gold);
      color: var(--ink); background: var(--gold);
    }
    a.btn:hover { background: var(--gold-hi); border-color: var(--gold-hi); }
    :focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="plinth">
    <p class="kicker">Error &middot; 404</p>
    <!-- CDIV = 404 in Roman numerals -->
    <h1 aria-label="404, page not found">CDIV</h1>
    <p class="sub">This page is not in the ledger</p>
    <p class="body">Whatever stood here has either been freed or was never
    entered into the records. Either way, the arena awaits.</p>
