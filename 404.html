<!doctype html>
<html lang="en">
<head>
<!-- GitHub Pages serves this file for ANY missing path, so everything is inlined
     and the home link is root-absolute (the site lives at the domain root). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found — Martian Bull</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--basalt:#0F0C09;--stone:#1C1611;--bone:#EFE3C6;--dim:#9B8C72;--bronze:#6F5731;--gold:#D4A545;--ember:#FF8A2A;--blood:#B8433D;
    --display:"Cinzel","Trajan Pro",Georgia,serif;--ui:"Rajdhani","Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem 1.25rem;
    color:#E6D9BD;font:500 17px/1.6 var(--ui);background:var(--basalt);
    background-image:radial-gradient(ellipse at 50% 0%,var(--stone) 0%,var(--basalt) 70%);border-top:1px solid var(--bronze)}
  .plinth{max-width:34rem}
  .kicker{font:600 13px/1 var(--ui);letter-spacing:.35em;text-transform:uppercase;color:var(--blood);margin:0 0 1rem}
  h1{font:900 clamp(3.4rem,18vw,6.5rem)/1 var(--display);color:var(--bone);letter-spacing:.14em;margin:0;padding:.35em .1em;
    border-top:1px solid var(--bronze);border-bottom:1px solid var(--bronze)}
  .sub{font:600 14px/1 var(--ui);letter-spacing:.3em;text-transform:uppercase;color:var(--ember);margin:1.4rem 0 0}
  p.body{color:var(--dim);margin:1.2rem 0 2rem}
  .laurel{width:min(220px,65vw);color:var(--gold);opacity:.9;margin:1.4rem auto 0;display:block}
  a.btn{display:inline-block;font:700 14px/1 var(--display);letter-spacing:.3em;text-transform:uppercase;text-decoration:none;padding:16px 28px;
    color:#FFE9CF;background:linear-gradient(180deg,#B6501E,#7E2C14);border:1px solid var(--ember);box-shadow:0 0 26px rgba(255,120,30,.45),inset 0 1px 0 rgba(255,200,140,.4);
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
  a.btn:hover{box-shadow:0 0 40px rgba(255,120,30,.7),inset 0 1px 0 rgba(255,200,140,.5)}
</style>
</head>
<body>
  <main class="plinth">
    <p class="kicker">Error &middot; 404</p>
    <!-- CDIV = 404 in Roman numerals -->
    <h1 aria-label="404, page not found">CDIV</h1>
    <p class="sub">This page is not in the ledger</p>
    <p class="body">Whatever stood here has either been freed or was never entered into the records. Either way, the arena awaits.</p>
    <svg class="laurel" viewBox="0 0 220 40" aria-hidden="true" focusable="false">

        <path d="M0 0 C5 -2.6 11 -2.2 15 0 C11 2.2 5 2.6 0 0 Z" transform="translate(155 30.6) rotate(6) scale(.9)"/>

        <path d="M0 0 C5 -2.6 11 -2.2 15 0 C11 2.2 5 2.6 0 0 Z" transform="translate(181 24.2) rotate(-8) scale(.72)"/>
        <path d="M0 0 C5 -2.6 11 -2.2 15 0 C11 2.2 5 2.6 0 0 Z" transform="translate(188 18.5) rotate(-28) scale(.66)"/>
      </g>
      <use href="#sprig-a" transform="translate(220 0) scale(-1 1)"/>

    <p style="margin-top:2rem"><a class="btn" href="/">Return to the arena</a></p>
  </main>
</body>
</html>
